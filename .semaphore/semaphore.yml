version: v1.0
name: "\U0001F3AF Simple CI Pipeline"
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2404
fail_fast:
  stop:
    when: branch != 'main'
auto_cancel:
  running:
    when: branch != 'main'
  queued:
    when: branch = 'main'
blocks:
  - name: Terraform
    dependencies: []
    task:
      jobs:
        - name: Init & validate
          commands:
            - checkout
            - cd 1-terraform-apply
            - export TF_INPUT=0
            - 'export TF_VAR_AWS_ACCESS_KEY_ID="${AWS_ACCESS_KEY_ID}"'
            - 'export TF_VAR_AWS_SECRET_ACCESS_KEY="${AWS_SECRET_ACCESS_KEY}"'
            - 'export TF_VAR_AWS_DEFAULT_REGION="${AWS_DEFAULT_REGION:-us-east-1}"'
            - terraform init
            - terraform validate
      secrets:
        - name: localstack
  - name: Localstack
    dependencies:
      - Terraform
    task:
      jobs:
        - name: Run & apply
          commands:
            - heckout
            - cd 1-terraform-apply
            - 'wget -q https://github.com/localstack/localstack-cli/releases/download/v4.3.0/localstack-cli-4.3.0-linux-amd64.tar.gz'
            - tar xzf localstack-cli-4.3.0-linux-amd64.tar.gz
            - chmod +x localstack/localstack
            - ./localstack/localstack start -d
            - '# Fail fast if secret vars are missing in this block'
            - ': "${AWS_ACCESS_KEY_ID:?AWS_ACCESS_KEY_ID is not set}"'
            - ': "${AWS_SECRET_ACCESS_KEY:?AWS_SECRET_ACCESS_KEY is not set}"'
            - export TF_INPUT=0
            - export TF_VAR_AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID"
            - export TF_VAR_AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY"
            - 'export TF_VAR_AWS_DEFAULT_REGION="${AWS_DEFAULT_REGION:-us-east-1}"'
            - '# Also export AWS vars for provider fallback chain'
            - export AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID"
            - export AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY"
            - 'export AWS_DEFAULT_REGION="${AWS_DEFAULT_REGION:-us-east-1}"'
            - terraform init -no-color
            - terraform plan -no-color -input=false -lock-timeout=60s -out=tfplan
            - terraform show -no-color tfplan
            - terraform apply -no-color -auto-approve tfplan
      secrets:
        - name: localstack
