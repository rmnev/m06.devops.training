version: v1.0
name: "\U0001F3AF Simple CI Pipeline"
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2404
fail_fast:
  stop:
    when: branch != 'main'
auto_cancel:
  running:
    when: branch != 'main'
  queued:
    when: branch = 'main'
blocks:
  - name: Preparation
    dependencies: []
    task:
      jobs:
        - name: Run localstack
          commands:
            - docker pull localstack/localstack
            - 'docker run -d -p 4566:4566 -p 4571:4571 --name localstack_container localstack/localstack'
            - docker logs localstack_container
      secrets:
        - name: localstack
  - name: "\U0001F680 Deploy"
    dependencies:
      - Preparation
    task:
      jobs:
        - name: "\U0001F4E6 Deploy to Production"
          commands:
            - echo "Building application..."
            - echo "Running security checks..."
            - echo "Deploying to production..."
            - echo "Deployment completed successfully!"
