version: v1.0
name: "\U0001F3AF Simple CI Pipeline"
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2404
fail_fast:
  stop:
    when: branch != 'main'
auto_cancel:
  running:
    when: branch != 'main'
  queued:
    when: branch = 'main'
blocks:
  - name: Preparation
    dependencies: []
    task:
      jobs:
        - name: Terraform init
          commands:
            - checkout
            - cd 1-terraform-apply
            - terraform init
      secrets:
        - name: localstack
  - name: Localstack
    dependencies:
      - Preparation
    task:
      jobs:
        - name: "\U0001F4E6 Deploy to Production"
          commands:
            - AWS_ACCESS_KEY_ID=test
            - AWS_SECRET_ACCESS_KEY=test
            - 'wget https://github.com/localstack/localstack-cli/releases/download/v4.3.0/localstack-cli-4.3.0-linux-amd64.tar.gz'
            - tar xvzf localstack-cli-4.3.0-linux-amd64.tar.gz
            - localstack/localstack start -d
            - checkout
            - cd 1-terraform-apply
            - terraform apply
