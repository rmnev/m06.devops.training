version: v1.0
name: Infrastructre as Code 2
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2404
fail_fast:
  stop:
    when: branch != 'main'
auto_cancel:
  running:
    when: branch != 'main'
  queued:
    when: branch = 'main'
blocks:
  - name: Terraform
    dependencies: []
    task:
      jobs:
        - name: Init & validate 3
          commands:
            - checkout
            - cd 3-terraform-dynamodb
            - docker rm -f localstack >/dev/null 2>&1 || true
            - 'docker run -d --name localstack -p 4566:4566 -e SERVICES=s3,sts,iam,ec2,sqs,sns localstack/localstack:3'
            - export TF_INPUT=0
            - 'export TF_VAR_AWS_ACCESS_KEY_ID="${AWS_ACCESS_KEY_ID}"'
            - 'export TF_VAR_AWS_SECRET_ACCESS_KEY="${AWS_SECRET_ACCESS_KEY}"'
            - 'export TF_VAR_AWS_DEFAULT_REGION="${AWS_DEFAULT_REGION:-us-east-1}"'
            - terraform init
            - terraform validate
      secrets:
        - name: localstack
  - name: Localstack
    dependencies:
      - Terraform
    task:
      jobs:
        - name: Run & apply 3
          commands:
            - checkout
            - cd 3-terraform-dynamodb
            - docker rm -f localstack >/dev/null 2>&1 || true
            - 'docker run -d --name localstack -p 4566:4566 -e SERVICES=s3,sts,iam,ec2,sqs,sns,dynamodb localstack/localstack:3'
            - sleep 20
            - 'curl -fsS http://localhost:4566/_localstack/health'
            - export TF_INPUT=0
            - 'export TF_VAR_AWS_ACCESS_KEY_ID="${AWS_ACCESS_KEY_ID:-test}"'
            - 'export TF_VAR_AWS_SECRET_ACCESS_KEY="${AWS_SECRET_ACCESS_KEY:-test}"'
            - 'export TF_VAR_AWS_DEFAULT_REGION="${AWS_DEFAULT_REGION:-us-east-1}"'
            - 'export TF_VAR_aws_endpoint="http://localhost:4566"'
            - export AWS_ACCESS_KEY_ID="$TF_VAR_AWS_ACCESS_KEY_ID"
            - export AWS_SECRET_ACCESS_KEY="$TF_VAR_AWS_SECRET_ACCESS_KEY"
            - export AWS_DEFAULT_REGION="$TF_VAR_AWS_DEFAULT_REGION"
            - terraform init -no-color
            - terraform plan -no-color -input=false -lock-timeout=60s -out=tfplan
            - terraform show -no-color tfplan
            - terraform apply -no-color -auto-approve tfplan
            - 'aws --endpoint-url=http://localhost:4566 s3 ls'
      secrets:
        - name: localstack
